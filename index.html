<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery de Sorvetes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f9; max-width: 600px; margin: 0 auto; padding-bottom: 90px; }
        
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 25px 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header h1 { font-size: 26px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .search-bar { margin: 15px 20px; }
        .search-bar input { width: 100%; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; font-size: 15px; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .category { margin: 0 20px 20px 20px; }
        .category-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; border-left: 4px solid #667eea; padding-left: 10px; }

        .item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; }
        .item:active { transform: scale(0.98); }
        .item-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 4px; color: #222; }
        .item-price { color: #667eea; }
        .item-description { font-size: 13px; color: #666; margin-bottom: 8px; }
        .item-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #888; }
        
        .badge-off { background: #ff4757; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .unavailable { opacity: 0.5; cursor: not-allowed; }

        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto; background: white; padding: 15px 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); display: none; z-index: 99; border-radius: 15px 15px 0 0; }
        .cart-bar.show { display: block; }
        .cart-info { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; background: #25d366; color: white; }
        .btn:disabled { background: #ccc; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #444; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }

        .loading { text-align: center; padding: 40px; color: #666; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍨 Delivery de Sorvetes</h1>
        <p>Faça seu pedido online rápido e fácil</p>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Buscar sabore ou produto..." onkeyup="filterMenu()">
    </div>

    <div id="menu-container">
        <div class="loading">Carregando cardápio... 🍦</div>
    </div>

    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <span id="cartCount">0 itens</span>
            <span id="cartTotal">R$ 0,00</span>
        </div>
        <button class="btn" onclick="openCart()">Ver Carrinho / Finalizar</button>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>🛒 Seu Pedido</span>
                <button class="close-btn" onclick="closeCart()">✕</button>
            </div>
            
            <div id="cartItems"></div>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="custName" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>Endereço de Entrega:</label>
                <input type="text" id="custAddress" placeholder="Rua, número e bairro">
            </div>
            <div class="form-group">
                <label>Forma de Pagamento:</label>
                <select id="custPayment">
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão de Crédito/Débito</option>
                </select>
            </div>

            <button class="btn" id="btnSend" onclick="sendOrder()">📤 Confirmar e Enviar Pedido</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyAvl2hoD1v7P1-hgOqd9rA1yxv1cfeG6WiJIfGKI55ZCLvWcDVx80KZNf0_Z1pzUKO/exec';
        const PHONE_NUMBER = '5582996935253';

        let menuData = [];
        let cart = [];

        async function fetchProducts() {
            try {
                const res = await fetch(WEB_APP_URL, { redirect: 'follow' });
                menuData = await res.json();
                renderMenu(menuData);
            } catch (err) {
                document.getElementById('menu-container').innerHTML = `
                    <div style="text-align:center; padding:30px; color:#ff4757;">
                        Não foi possível carregar o cardápio. Recarregue a página.
                    </div>`;
            }
        }

        function renderMenu(data) {
            const container = document.getElementById('menu-container');
            if(!data || data.length === 0) {
                container.innerHTML = '<div class="loading">Nenhum produto encontrado.</div>';
                return;
            }

            const categories = {};
            data.forEach(item => {
                if(!categories[item.categoria]) categories[item.categoria] = [];
                categories[item.categoria].push(item);
            });

            let html = '';
            for(let cat in categories) {
                html += `<div class="category"><div class="category-title">${cat}</div>`;
                categories[cat].forEach(item => {
                    const active = item.disponivel && item.estoque > 0;
                    html += `
                        <div class="item ${!active ? 'unavailable' : ''}" onclick="${active ? `addToCart('${item.produto}', ${item.preco}, ${item.estoque})` : ''}">
                            <div class="item-header">
                                <span>${item.produto}</span>
                                <span class="item-price">R$ ${item.preco.toFixed(2)}</span>
                            </div>
                            <div class="item-description">${item.descricao}</div>
                            <div class="item-footer">
                                <span>${active ? 'Estoque: ' + item.estoque : '<span class="badge-off">Indisponível</span>'}</span>
                                ${active ? '<strong style="color:#667eea;">+ Adicionar</strong>' : ''}
                            </div>
                        </div>`;
                });
                html += '</div>';
            }
            container.innerHTML = html;
        }

        function addToCart(produto, preco, estoque) {
            let item = cart.find(i => i.produto === produto);
            if(item) {
                if(item.quantidade >= estoque) {
                    alert('Quantidade máxima em estoque atingida!');
                    return;
                }
                item.quantidade++;
            } else {
                cart.push({ produto, preco, quantidade: 1, estoqueMax: estoque });
            }
            updateCart();
        }

        function updateCart() {
            const totalItems = cart.reduce((sum, i) => sum + i.quantidade, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.preco * i.quantidade), 0);
            
            document.getElementById('cartCount').textContent = `${totalItems} ${totalItems === 1 ? 'item' : 'itens'}`;
            document.getElementById('cartTotal').textContent = `R$ ${totalPrice.toFixed(2)}`;
            document.getElementById('cartBar').classList.toggle('show', totalItems > 0);
        }

        function openCart() {
            const container = document.getElementById('cartItems');
            let html = '';
            cart.forEach((item, idx) => {
                html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <div>
                            <strong>${item.produto}</strong><br>
                            <small>R$ ${item.preco.toFixed(2)} x ${item.quantidade}</small>
                        </div>
                        <div>
                            <button onclick="changeQty(${idx}, -1)" style="padding:2px 8px;">-</button>
                            <span style="margin:0 5px;">${item.quantidade}</span>
                            <button onclick="changeQty(${idx}, 1)" style="padding:2px 8px;">+</button>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
            document.getElementById('cartModal').classList.add('show');
        }

        function changeQty(idx, delta) {
            cart[idx].quantidade += delta;
            if(cart[idx].quantidade <= 0) cart.splice(idx, 1);
            updateCart();
            if(cart.length === 0) closeCart();
            else openCart();
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('show');
        }

        async function sendOrder() {
            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const payment = document.getElementById('custPayment').value;

            if(!name || !address) {
                alert('Preencha seu nome e endereço.');
                return;
            }

            const btn = document.getElementById('btnSend');
            btn.disabled = true;
            btn.textContent = 'Processando...';

            try {
                // Dá baixa no estoque do Google Sheets
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ items: cart })
                });
                const result = await res.json();

                if(result.status === 'stock_error') {
                    alert(result.message);
                    fetchProducts();
                    btn.disabled = false;
                    btn.textContent = '📤 Confirmar e Enviar Pedido';
                    return;
                }

                // Monta texto do WhatsApp
                let text = `🍨 *NOVO PEDIDO* 🍨\n\n👤 *Cliente:* ${name}\n📍 *Endereço:* ${address}\n💳 *Pagamento:* ${payment}\n\n📋 *Itens:*\n`;
                let total = 0;
                cart.forEach(i => {
                    text += `• ${i.quantidade}x ${i.produto} (R$ ${(i.preco * i.quantidade).toFixed(2)})\n`;
                    total += i.preco * i.quantidade;
                });
                text += `\n💰 *Total:* R$ ${total.toFixed(2)}`;

                window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');

                cart = [];
                updateCart();
                closeCart();
                fetchProducts();

            } catch(err) {
                alert('Erro ao enviar pedido. Tente novamente.');
            } finally {
                btn.disabled = false;
                btn.textContent = '📤 Confirmar e Enviar Pedido';
            }
        }

        function filterMenu() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = menuData.filter(i => 
                i.produto.toLowerCase().includes(q) || 
                i.categoria.toLowerCase().includes(q)
            );
            renderMenu(filtered);
        }

        fetchProducts();
    </script>
</body>
</html>
